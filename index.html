<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
  <div class="cartao-aplicacao">
    <header class="cabecalho-aplicacao">
        <h1>Minhas Tarefas</h1>
        <div class="botoes-cabecalho">
            <button id="botao-ajuda" class="botao-icone" type="button" title="Novidades e Ajuda">
                <i class="fa-solid fa-circle-question"></i>
            </button>
            <button id="botao-tema" class="botao-icone" type="button" title="Alternar Tema">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL (INPUT E IMAGEM DENTRO DO CARTÃO) -->
    <div class="conteudo-principal">
        <div class="caixa-entrada">
            <input type="text" id="campo-tarefa" placeholder="O que vamos fazer hoje?..." maxlength="40">
            <button id="botao-adicionar" class="botao-principal">
                <i class="fa-solid fa-plus"></i>Adicionar
            </button>
        </div>

        <div class="area-imagem">
            <img src="WhatsApp Image 2026-10-02 at 09.43.07.jpeg" alt="Imagem do Painel">
        </div>
    </div>

    <!-- FILTROS DE TAREFAS -->
    <div class="area-filtros">
        <button class="botao-filtro ativo" data-filtro="todas">Todas</button>
        <button class="botao-filtro" data-filtro="pendentes">Pendentes</button>
        <button class="botao-filtro" data-filtro="concluidas">Concluídas</button>
    </div>

    <ul id="lista-tarefas" class="lista-tarefas">
        <!-- As tarefas serão inseridas aqui dinamicamente via JS -->
    </ul>

    <footer class="rodape-aplicacao">
        <span id="contador-tarefas">0 tarefas na lista</span>
        <button id="botao-limpar-todas" class="botao-limpar" type="button">
            <i class="fa-solid fa-trash-can"></i> Limpar Todas
        </button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
